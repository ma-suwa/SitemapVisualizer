<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>サイトマップ可視化くん（β版）</title>
  <link rel="stylesheet" href="style.css">
  <script src="lib/tweakpane.min.js"></script>
  <script src="lib/d3.v5.min.js"></script>
</head>

<body>
  <div class="wrapper">
    <h1>サイトマップ可視化くん（β版）</h1>
    <p>各ページのURLが並んだ<a href="default.csv">こんな感じの</a>CSVファイルをアップロードしてね。<a href="default2.csv">https://wwwがなくても大丈夫。</a></p>
  </div>

  <div class="chart-controls">
    <input type="file" id="csvFile" accept=".csv" />
    <div class="pattern-tabs">
      <button class="tab-btn active" data-pattern="B">縦に並べる</button>
      <button class="tab-btn" data-pattern="C">横に並べる</button>
    </div>
  </div>

  <div id="svg-container"></div>

  <script src="lib/papaparse.min.js"
    integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./_chart.js"></script>
</body>

</html>
