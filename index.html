<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>サイトマップ可視化くん（β版）</title>
  <link rel="stylesheet" href="style.css">
  <script src="lib/tweakpane.min.js"></script>
  <script src="lib/d3.v5.min.js"></script>
</head>

<body>
  <div class="wrapper">
    <div class="site-logo">
      <div class="logo-group">
        <img src="svg/chapome.svg" alt="キャラクター" class="logo-chapome">
        <img src="svg/tagline.svg" alt="サイトマップ可視化くん（β版）" class="logo-tagline">
      </div>
    </div>
    <div class="description" id="csv-description">
      <div class="desc-body">
        <div class="desc-text-col">
          <p>URLのリストを記載したcsvファイルをアップロードするだけで、サイトマップを自動生成。</br>SVGでダウンロードしてFigmaなどでそのまま編集できます。</p>
          <ul class="desc-rules">
            <li class="desc-note">※https:// や www. がなくても自動補完します。</li>
            <li class="desc-note"><a href="default.csv" download>サンプルCSVをダウンロード</a></li>
          </ul>
        </div>
        <div class="desc-preview-col">
          <table class="spreadsheet-mock">
            <colgroup>
              <col class="sm-col-url">
              <col class="sm-col-label">
            </colgroup>
            <thead>
              <tr class="sm-header">
                <th class="sm-cell sm-col-head"><span class="col-badge">A列</span>URL（必須）</th>
                <th class="sm-cell sm-col-head sm-col-head--b"><span class="col-badge col-badge--opt">B列</span>表示ラベル（任意）
                </th>
              </tr>
            </thead>
            <tbody>
              <tr class="sm-row">
                <td class="sm-cell sm-url">https://example.com/</td>
                <td class="sm-cell sm-label">トップ</td>
              </tr>
              <tr class="sm-row">
                <td class="sm-cell sm-url">https://example.com/about/</td>
                <td class="sm-cell sm-label">会社概要</td>
              </tr>
              <tr class="sm-row">
                <td class="sm-cell sm-url">example.com/contact/</td>
                <td class="sm-cell sm-label">コンタクト</td>
              </tr>
              <tr class="sm-row">
                <td class="sm-cell sm-url">example.com/news/</td>
                <td class="sm-cell sm-label">ニュース</td>
              </tr>
              <tr class="sm-row">
                <td class="sm-cell sm-url">example.com/news/article1/</td>
                <td class="sm-cell sm-label">記事1</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="chart-controls">
      <label class="file-upload-btn" for="csvFile">CSVファイルをアップロード</label>
      <input type="file" id="csvFile" accept=".csv" />

          </svg>
          <span>横並べ</span>
        </button>
      </div>
    </div>


    <div class="main-layout">
      <aside id="pane-container"></aside>
      <div id="svg-container"></div>
    </div>

  </div>


  <script src="lib/papaparse.min.js"
    integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./_chart.js"></script>
</body>

</html>
